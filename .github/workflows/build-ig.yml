name: Build and Publish FHIR IG

on:
  push:
    branches:
      - main
      - '**'
      - '!main'  # Exclude main branch pushes (handled by pull_request)
  pull_request:
    branches: 
      - main     # Only build PRs targeting main branch
    types: [opened, synchronize, reopened]  # Don't build on other PR events

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Ruby
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby-full build-essential
        
    - name: Configure Gem Installation Directory
      run: |
        echo '# Install Ruby Gems to ~/gems' >> ~/.bashrc
        echo 'export GEM_HOME="$HOME/gems"' >> ~/.bashrc
        echo 'export PATH="$HOME/gems/bin:$PATH"' >> ~/.bashrc
        source ~/.bashrc
        
    - name: Install Jekyll and Bundler
      run: |
        source ~/.bashrc
        gem install jekyll bundler --user-install
        
    - name: Install SUSHI
      run: npm install -g fsh-sushi
      
    - name: Download IG Publisher
      run: |
        mkdir -p input-cache
        wget -q https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -O input-cache/publisher.jar
        
    - name: Build IG
      run: java -jar input-cache/publisher.jar -ig ig.ini

    # For the main branch, deploy to root of gh-pages
    - name: Upload Pages artifact (main)
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./output
        
    - name: Deploy to GitHub Pages (main)
      if: github.ref == 'refs/heads/main'
      id: deployment-main
      uses: actions/deploy-pages@v4

    # For other branches, deploy to branch-specific directory
    - name: Get branch name
      if: github.ref != 'refs/heads/main'
      id: branch-name
      run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Prepare branch deployment directory
      if: github.ref != 'refs/heads/main'
      run: |
        # Create branch directory in gh-pages
        mkdir -p gh-pages
        # Move output to branch directory
        mv output "gh-pages/branch-${{ steps.branch-name.outputs.branch }}"

    - name: Upload Pages artifact (branch)
      if: github.ref != 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./gh-pages

    - name: Deploy to GitHub Pages (branch)
      if: github.ref != 'refs/heads/main'
      id: deployment-branch
      uses: actions/deploy-pages@v4

    # Output the published URL
    - name: Output Published URL (main)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "::notice::IG Published to https://sirkyp.github.io/fhir-t1d-exchange/"

    - name: Output Published URL (branch)
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::notice::IG Published to https://sirkyp.github.io/fhir-t1d-exchange/branch-${{ steps.branch-name.outputs.branch }}/"
