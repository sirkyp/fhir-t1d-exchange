name: Build and Publish FHIR IG

on:
  # Only trigger on PR events when targeting main
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  # Only trigger on push events to non-PR branches
  push:
    branches-ignore:
      - main  # Ignore main branch pushes as they're handled by PR events

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Only run on PR events or push events to non-PR branches
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && github.ref != 'refs/heads/main' && !github.event.pull_request)
    runs-on: ubuntu-latest
    
    steps:
    - name: Debug Event Info
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        ACTOR: ${{ github.actor }}
      run: |
        echo "Event name: $EVENT_NAME"
        echo "Event ref: $EVENT_REF"
        echo "PR number: $PR_NUMBER"
        echo "Head ref: $HEAD_REF"
        echo "Base ref: $BASE_REF"
        echo "Actor: $ACTOR"
        echo "Is PR? ${{ github.event.pull_request != null }}"
        echo "Full event path: ${{ github.event_path }}"
        cat ${{ github.event_path }}
        
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Set up Ruby
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby-full build-essential zlib1g-dev
        
    - name: Set up Bundler
      run: |
        # Create Gemfile
        echo "source 'https://rubygems.org'" > Gemfile
        echo "gem 'jekyll'" >> Gemfile
        echo "gem 'webrick'" >> Gemfile  # Required for Ruby >= 3.0
        
        # Set up gems directory
        export GEM_HOME="$HOME/.gem"
        export GEM_PATH="$HOME/.gem"
        export PATH="$HOME/.gem/bin:$PATH"
        
        # Install bundler
        gem install bundler
        
        # Install gems via bundler
        bundle install
        
        # Verify installations
        echo "Ruby version: $(ruby -v)"
        echo "Bundler version: $(bundle -v)"
        bundle exec jekyll -v
        
        # Make paths available to subsequent steps
        echo "GEM_HOME=$GEM_HOME" >> $GITHUB_ENV
        echo "GEM_PATH=$GEM_PATH" >> $GITHUB_ENV
        echo "$HOME/.gem/bin" >> $GITHUB_PATH
        
    - name: Verify Jekyll Installation
      run: |
        echo "Checking Jekyll installation..."
        which jekyll
        bundle exec jekyll -v
        
    - name: Install SUSHI
      run: npm install -g fsh-sushi
      
    - name: Download IG Publisher
      run: |
        mkdir -p input-cache
        wget -q https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -O input-cache/publisher.jar
        
    - name: Build IG
      run: java -jar input-cache/publisher.jar -ig ig.ini

    # For the main branch, deploy to root of gh-pages
    - name: Upload Pages artifact (main)
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./output
        
    - name: Deploy to GitHub Pages (main)
      if: github.ref == 'refs/heads/main'
      id: deployment-main
      uses: actions/deploy-pages@v4

    # For other branches, deploy to branch-specific directory
    - name: Get branch name
      if: github.ref != 'refs/heads/main'
      id: branch-name
      run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Prepare branch deployment directory
      if: github.ref != 'refs/heads/main'
      run: |
        # Create branch directory in gh-pages
        mkdir -p gh-pages
        # Move output to branch directory
        mv output "gh-pages/branch-${{ steps.branch-name.outputs.branch }}"

    - name: Upload Pages artifact (branch)
      if: github.ref != 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./gh-pages

    - name: Deploy to GitHub Pages (branch)
      if: github.ref != 'refs/heads/main'
      id: deployment-branch
      uses: actions/deploy-pages@v4

    # Output the published URL
    - name: Output Published URL (main)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "::notice::IG Published to https://sirkyp.github.io/fhir-t1d-exchange/"

    - name: Output Published URL (branch)
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::notice::IG Published to https://sirkyp.github.io/fhir-t1d-exchange/branch-${{ steps.branch-name.outputs.branch }}/"
